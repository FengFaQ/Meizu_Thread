<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-visual">
<title>魅族线程</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="env-banner" class="env-banner" style="display:none">
  ⚠️ 未检测到 Root WebUI 接口，请在 KernelSU 管理器 / APatch 的模块 WebUI 中打开本页面。
</div>

<!-- ============ 用户线程（写入 Scene 的 threads.json）============ -->
<section id="screen-list" class="screen">
  <header class="topbar">
    <div class="topbar-title">
      <h1>魅族线程</h1>
      <div id="status" class="status">正在初始化…</div>
    </div>
    <div class="topbar-actions">
      <button id="btn-settings" class="icon-btn" title="设置">设置</button>
      <button id="btn-reload" class="icon-btn" title="重新读取文件">刷新</button>
      <button id="btn-raw" class="icon-btn" title="原始 JSON">JSON</button>
    </div>
  </header>

  <div class="modetabs">
    <button class="modetab active" data-root="list">用户线程</button>
    <button class="modetab" data-root="asoul">游戏线程</button>
  </div>

  <div id="default-hint" class="default-hint" style="display:none">
    <span id="default-hint-text"></span>
    <button id="btn-load-default" class="btn-secondary small">载入默认</button>
  </div>

  <div id="list" class="list"></div>

  <div class="fab-row">
    <button id="btn-add" class="fab" title="添加规则">＋</button>
  </div>

  <div class="bottom-bar">
    <button id="btn-import" class="btn-secondary" title="从 JSON 文件导入">导入</button>
    <button id="btn-export" class="btn-secondary" title="导出到 JSON 文件">导出</button>
    <button id="btn-save" class="btn-primary">保存</button>
  </div>
</section>

<!-- ============ 游戏线程（AsoulOpt 配置）============ -->
<section id="screen-asoul" class="screen" style="display:none">
  <header class="topbar">
    <div class="topbar-title">
      <h1>游戏线程</h1>
      <div id="asoul-status" class="status">加载中…</div>
    </div>
    <div class="topbar-actions">
      <button id="btn-asoul-reload" class="icon-btn" title="重新读取">刷新</button>
    </div>
  </header>

  <div class="modetabs">
    <button class="modetab" data-root="list">用户线程</button>
    <button class="modetab active" data-root="asoul">游戏线程</button>
  </div>

  <div id="asoul-body" class="list"></div>
</section>

<section id="screen-editor" class="screen" style="display:none">
  <header class="topbar">
    <button id="btn-back" class="icon-btn">‹ 返回</button>
    <div class="topbar-title">
      <h1 id="editor-title">查看规则</h1>
    </div>
    <div class="topbar-actions">
      <button id="btn-editor-save" class="btn-primary small">保存</button>
    </div>
  </header>
  <div id="editor-form" class="editor-form"></div>
</section>

<section id="screen-raw" class="screen" style="display:none">
  <header class="topbar">
    <button id="btn-raw-back" class="icon-btn">‹ 返回</button>
    <div class="topbar-title">
      <h1>原始 JSON</h1>
    </div>
    <button id="btn-raw-apply" class="btn-primary small">应用</button>
  </header>
  <textarea id="raw-textarea" class="raw-textarea" spellcheck="false"></textarea>
</section>

<section id="screen-settings" class="screen" style="display:none">
  <header class="topbar">
    <button id="btn-settings-back" class="icon-btn">‹ 返回</button>
    <div class="topbar-title">
      <h1>设置</h1>
    </div>
    <span></span>
  </header>
  <div id="settings-form" class="settings-form"></div>
</section>

<div id="fp-overlay" class="overlay" style="display:none">
  <div class="filepicker">
    <header class="topbar">
      <button id="fp-close" class="icon-btn">‹ 取消</button>
      <div class="topbar-title">
        <h1 id="fp-title">选择文件</h1>
      </div>
      <span></span>
    </header>
    <div class="fp-shortcuts" id="fp-shortcuts"></div>
    <div class="fp-path" id="fp-path"></div>
    <div class="fp-list" id="fp-list"></div>
    <div class="fp-savebar" id="fp-savebar" style="display:none">
      <input type="text" id="fp-filename" class="fp-filename-input" placeholder="文件名，如 threads_export.json">
      <button id="fp-confirm" class="btn-primary">导出到此处</button>
    </div>
  </div>
</div>

<div id="dialog" class="dialog-overlay" style="display:none">
  <div class="dialog-box" role="dialog" aria-modal="true">
    <div id="dialog-message" class="dialog-message"></div>
    <div class="dialog-actions">
      <button id="dialog-cancel" class="btn-secondary" style="display:none">取消</button>
      <button id="dialog-ok" class="btn-primary">确定</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="app.js"></script>
</body>
</html>
