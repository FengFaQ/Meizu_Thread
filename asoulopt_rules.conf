# ============================================================
# AsoulOpt 游戏线程段（独立部分）
# ============================================================
# 来源：nakixii/Magisk_AsoulOpt 支持列表
# 规模：333 个游戏条目
#
# 匹配语义：
#   AsoulOpt 原为「包名包含该片段即命中」的子串匹配。
#   彗星引擎包名走 fnmatch，支持 * ? []，故写作 *片段* 完全等价。
#   例：com.Nekootan.kfkj.android 命中 *Nekootan.kfkj*
#
# 线程分配理念（沿用彗星 Game_8G3.txt）：
#     主线程/引擎线程 -> hp-core  （大核，保帧率下限）
#     渲染/图形线程   -> p-core   （性能核）
#     其余线程/兜底   -> p-core
#
# 注：线程名遵循内核 TASK_COMM_LEN-1=15 字符截断，
#     如 UnityGfxDeviceWorker -> UnityGfxDeviceW。
# ============================================================

# ---------- 游戏 ----------

