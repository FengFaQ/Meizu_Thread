# ============================================================
# 魅族 (Meizu / Flyme) 专属线程规则
# ============================================================
# 来源：RS2.0.2daily/applist.conf 中全部 com.meizu.* / com.flyme.* 规则
# 提取：完整提取，未做任何取舍
# 规模：89 个包 / 265 条规则
#
# 核心映射（原 RS 使用写死的 4+3+1 拓扑编号，此处改为符号名，
# 由引擎按魅族21 实测拓扑 2+3+2+1 在运行时展开）：
#     原 0-1  (小核/后台)   -> e-core
#     原 2-5  (中大核/渲染) -> p-core
#     原 4-5  (进程级兜底)  -> e-core,p-core
#       注：不映射为 hp-core。RS 的 4-5 是 4+3+1 下的 2 个性能核，
#       而魅族21 的 hp-core 只展开为单个超大核(核心7)，
#       89 个包的兜底线程挤到 1 个核会争抢；故与彗星底座一致用 e-core,p-core。
#     线程级规则 (包名{线程}=X) 保持原映射 e/p/hp-core。
#
# 规则含义：
#     包名{线程}=核心    指定线程绑核
#     包名{包名或后15位}=核心   主线程（Android 主线程名=进程名）
#     包名=核心           进程内其余线程兜底
# ============================================================


